<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Selenium iframe ve textarea örneği</title>
</head>
<body>
<h1>Ana sayfa</h1>
<p>Textarea alanı aşağıdaki iframe'in içindedir.</p>
<iframe id="textarea-frame" title="Textarea örnek alanı"
        srcdoc="<!doctype html><html lang='tr'><meta charset='UTF-8'><body><label for='review'>Yorum:</label><br><textarea id='review' rows='4' cols='50'>Başlangıç metni</textarea></body></html>">
</iframe>
</body>
</html>
